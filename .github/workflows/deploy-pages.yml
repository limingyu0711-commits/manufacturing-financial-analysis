name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "tests/test_dashboard_metrics.js"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify static Dashboard files
        run: |
          test -f dashboard/index.html
          test -f dashboard/css/styles.css
          test -f dashboard/js/dashboard-data.js
          test -f dashboard/js/i18n.js
          test -f dashboard/js/metrics.js
          test -f dashboard/js/app.js

      - name: Run Dashboard calculation tests
        run: node --test tests/test_dashboard_metrics.js

      - name: Upload static Dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

